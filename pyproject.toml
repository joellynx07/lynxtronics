[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "lynxtronics"
version = "0.1.0"
description = "A pure-Python toolkit for electrical and electronics engineers: circuits, power, signals, filters, embedded and control calculations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joel Judiah Amoah", email = "joeljudiahamoah17@gmail.com" }]
keywords = ["electronics", "electrical-engineering", "circuits", "embedded", "signal-processing", "control", "calculator", "engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "numpy>=1.22"]
dev = ["pytest>=7", "build", "twine", "ruff"]

[project.scripts]
lynx = "lynxtronics.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/lynxtronics"
Issues = "https://github.com/YOUR-USERNAME/lynxtronics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lynxtronics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
